services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: civic
      POSTGRES_PASSWORD: civic
      POSTGRES_DB: civic_dna
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civic -d civic_dna"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      civic_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://civic:civic@db:5432/civic_dna
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-env}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "60"
      OFFICER_BOOTSTRAP_USERNAME: ${OFFICER_BOOTSTRAP_USERNAME:-officer}
      OFFICER_BOOTSTRAP_PASSWORD: ${OFFICER_BOOTSTRAP_PASSWORD:-changeme}
      CIVIC_CREATE_TABLES: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  civic_pgdata:
